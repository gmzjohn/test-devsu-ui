<div class="accounts-header">
  <h1>{{ title }}</h1>
  <button routerLink="/accounts/create">Nuevo</button>
</div>
<app-dynamic-table
  [trackByKey]="'id'"
  [columns]="accountColumns"
  [data]="accountData()"
  [searchKey]="'accountNumber'"
  (onEdit)="onEdit($event)"
  (onDelete)="onDelete($event)"
></app-dynamic-table>
