<div class="movements-header">
  <h1>{{ title }}</h1>
  <button routerLink="/movements/create">Nuevo</button>
</div>
<app-dynamic-table
  [trackByKey]="'id'"
  [columns]="movementColumns"
  [data]="movementData()"
  [searchKey]="'accountId'"
  (onEdit)="onEdit($event)"
  (onDelete)="onDelete($event)"
></app-dynamic-table>
